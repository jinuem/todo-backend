name: Backend Agent Workflow

on:
  repository_dispatch:
    types: [requirements_updated]
  workflow_dispatch:

jobs:
  backend-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: init

      - name: Checkout Requirements Repo
        uses: actions/checkout@v4
        with:
          repository: jinuem/todo-requirements
          token: ${{ secrets.GITHUB_TOKEN }}
          path: requirements
          ref: init

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Backend Agent
        run: |
          echo "Backend Agent: Processing requirements update..."
          echo "Latest requirements:"
          cat requirements/PRD.md
          echo "Collaboration log:"
          cat requirements/COLLABORATION.md
          
          # TODO: Add Kiro CLI agent execution here
          # kiro-cli chat --agent backend-agent --input "$(cat requirements/PRD.md)"
          
          echo "Backend Agent: Work completed, updating collaboration log..."

      - name: Update Collaboration Log
        run: |
          cd requirements
          echo "" >> COLLABORATION.md
          echo "### [$(date '+%Y-%m-%d %H:%M')] - Backend Agent" >> COLLABORATION.md
          echo "- Processed requirements update" >> COLLABORATION.md
          echo "- Updated backend API" >> COLLABORATION.md
          
      - name: Commit Requirements Updates
        run: |
          cd requirements
          git config --local user.email "action@github.com"
          git config --local user.name "Backend Agent"
          git add COLLABORATION.md
          git commit -m "Backend Agent: Updated collaboration log" || exit 0
          git push origin init
